<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7EC8F8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jelly Brawl">
  <meta name="format-detection" content="telephone=no">
  <title>Jelly Brawl</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #1B1024;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #game {
      position: fixed;
      display: block;
      background: #1B1024;
    }

    #boot {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #7ec8f8;
      transition: opacity 0.4s ease;
    }

    #boot.is-out { opacity: 0; pointer-events: none; }

    #boot { container-type: size; }

    #boot-stage {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
      width: min(100cqw, calc(100cqh * 16 / 9));
      height: min(100cqh, calc(100cqw * 9 / 16));
      overflow: hidden;
    }

    /* 手机竖持时，把整页转成横屏尺寸铺满屏幕。 */
    html.turn-landscape {
      width: 100dvh;
      height: 100dvw;
      position: fixed;
      inset: auto;
      top: -100dvw;
      left: 0;
      transform: rotate(90deg);
      transform-origin: bottom left;
      overflow: hidden;
    }

    html.turn-landscape body {
      width: 100%;
      height: 100%;
    }

    .boot-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .boot-label, .boot-pct, .boot-tip {
      position: absolute;
      z-index: 1;
      margin: 0;
      color: #fff;
      font-weight: 800;
      text-align: center;
      background: none;
      text-shadow:
        0 2px 0 #163e8c,
        1px 0 0 #163e8c,
        -1px 0 0 #163e8c,
        0 -1px 0 #163e8c,
        1px 1px 0 #163e8c,
        -1px 1px 0 #163e8c,
        1px -1px 0 #163e8c,
        -1px -1px 0 #163e8c;
    }

    .boot-label {
      left: 50%;
      top: 81.4%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-size: clamp(13px, 2.4cqi, 28px);
      white-space: nowrap;
    }

    .boot-track {
      position: absolute;
      z-index: 1;
      left: 28.5%;
      top: 85.6%;
      width: 42.5%;
      height: 5.9%;
      box-sizing: border-box;
      border: 3px solid #0d2a86;
      border-radius: 999px;
      overflow: hidden;
      background: linear-gradient(#10308f, #1a46b8);
      box-shadow: inset 0 -2px 0 rgba(110, 200, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .boot-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(180deg, #fff4b0 0%, #ffd24a 42%, #f5a623 100%);
      transition: width 0.12s linear;
    }

    .boot-pct {
      left: 72%;
      top: 88.5%;
      transform: translateY(-50%);
      font-size: 16px;
      font-size: clamp(12px, 2.1cqi, 26px);
    }

    .boot-tip {
      left: 50%;
      top: 95.6%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-size: clamp(11px, 1.7cqi, 20px);
      font-weight: 700;
      white-space: nowrap;
    }

    #boot-stage { container-type: inline-size; }

    #rotate {
      display: none;
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: calc(16px + var(--sab));
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(32, 12, 28, 0.88);
      color: #fff6fb;
      font: 700 14px/1.2 "Segoe UI", sans-serif;
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: block; }
    }

    html.turn-landscape #rotate { display: none; }

    #exit-full {
      position: fixed;
      z-index: 60;
      top: calc(12px + var(--sat));
      right: calc(12px + var(--sar));
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: rgba(32, 12, 28, 0.88);
      color: #fff;
      font: 700 15px/1 "Segoe UI", sans-serif;
      touch-action: auto;
    }

    #exit-full[hidden] { display: none; }

    #join, #update {
      position: fixed;
      z-index: 30;
      left: 50%;
      transform: translateX(-50%);
      touch-action: auto;
    }

    #join {
      bottom: 12%;
      display: flex;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(32, 12, 28, 0.94);
    }

    #join[hidden], #update[hidden] { display: none; }

    #join input, #join button, #update {
      border: 0;
      border-radius: 12px;
      font: 700 18px/1 "Segoe UI", sans-serif;
    }

    #join input {
      width: 7em;
      padding: 12px;
      text-transform: uppercase;
      text-align: center;
    }

    #join button, #update {
      padding: 12px 16px;
      background: #ff6b9d;
      color: #fff;
    }

    #update { bottom: 24px; }
  </style>
</head>
<body>
  <div id="boot">
    <div id="boot-stage">
      <img class="boot-art" src="./assets/loading-art.jpg" alt="Jelly Brawl 果冻擂台">
      <p class="boot-label">正在加载资源...</p>
      <div class="boot-track" aria-hidden="true"><div class="boot-fill"></div></div>
      <p class="boot-pct">0%</p>
      <p class="boot-tip">💡 小心！被撞到会变小！</p>
    </div>
  </div>
  <canvas id="game" width="1280" height="720" aria-label="Jelly Brawl"></canvas>
  <p id="rotate">请把手机横过来</p>
  <form id="join" hidden>
    <input id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="房间码">
    <button type="submit">加入</button>
  </form>
  <button id="update" type="button" hidden>点击更新</button>
  <button id="exit-full" type="button" hidden>关闭全屏</button>
  <script>
    // 禁止下拉刷新、双指缩放和长按菜单，保证横屏操作不被页面抢走。
    document.addEventListener('touchmove', (event) => {
      if (event.target.closest && event.target.closest('#debug, #join, #update, #exit-full')) return;
      event.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (event) => event.preventDefault());
    document.addEventListener('contextmenu', (event) => event.preventDefault());
  </script>
  <script type="module" src="./src/loading.js?v=17"></script>
</body>
</html>
